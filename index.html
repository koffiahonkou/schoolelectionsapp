<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Elections Voting App</title>
    <meta name="description" content="A secure, modern school election voting system featuring Firebase Firestore anonymous vote storage, voter token management, and real-time live agent monitoring." />
    <meta property="og:title" content="School Elections Voting App" />
    <meta property="og:description" content="A secure, modern school election voting system featuring Firebase Firestore anonymous vote storage, voter token management, and real-time live agent monitoring." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Diagnostic safety helper for static deployments
      window.addEventListener('error', function(event) {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          root.innerHTML = '<div style="font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:32px;max-width:480px;margin:80px auto;background:#fff;border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,0.08);border:1px solid #e2e8f0;text-align:center;">' +
            '<div style="width:48px;height:48px;border-radius:12px;background:#fef3c7;color:#d97706;display:flex;align-items:center;justify-content:center;margin:0 auto 16px auto;font-weight:900;font-size:24px;">!</div>' +
            '<h2 style="font-size:20px;font-weight:800;color:#0f172a;margin:0 0 8px 0;">Election Station Launch Notice</h2>' +
            '<p style="font-size:13px;color:#64748b;margin:0 0 20px 0;line-height:1.5;">The system encountered a startup or cache sync issue.</p>' +
            '<button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}location.reload();" style="background:#f59e0b;color:#0f172a;border:none;padding:12px 24px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;">Reset Cache & Launch Station</button>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
